name: Lint & Format Check

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: ESLint & Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint -- --format=json --output-file=eslint-report.json || true

      - name: Run Prettier check
        id: prettier
        run: npm run format -- --check

      - name: Comment PR with linting results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let eslintReport = '';

            try {
              const report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
              const errors = report.flatMap(f => f.messages.filter(m => m.severity === 2));
              const warnings = report.flatMap(f => f.messages.filter(m => m.severity === 1));
              
              if (errors.length > 0 || warnings.length > 0) {
                eslintReport = `### ESLint Report\n\n`;
                if (errors.length > 0) {
                  eslintReport += `⛔ **Errors:** ${errors.length}\n`;
                }
                if (warnings.length > 0) {
                  eslintReport += `⚠️ **Warnings:** ${warnings.length}\n`;
                }
              }
            } catch (e) {
              // ESLint report not generated
            }

            let comment = eslintReport || '✅ No ESLint issues found!';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if ESLint found errors
        run: |
          if [ -f eslint-report.json ]; then
            ERRORS=$(jq '[.[] | .messages[] | select(.severity == 2)]' eslint-report.json | jq 'length')
            if [ "$ERRORS" -gt 0 ]; then
              echo "❌ ESLint found $ERRORS error(s). Please fix them."
              exit 1
            fi
          fi
